
name: corporate-automation-lab

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD}"

    ports:
      - "127.0.0.1:14330:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -l 5 -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: src/CorporateAutomation.Api/Dockerfile

    image: corporate-automation-api:dev

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__CorporateAutomation: "Server=sqlserver,1433;Database=CorporateAutomation;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"

      Jwt__Key: "${JWT_KEY:?Falta JWT_KEY}"
      Jwt__Issuer: "CorporateAutomation.Api"
      Jwt__Audience: "CorporateAutomation.Client"

      Auth__DevelopmentTokenPassword: "${DEV_TOKEN_PASSWORD:?Falta DEV_TOKEN_PASSWORD}"

    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqlserver-data:
