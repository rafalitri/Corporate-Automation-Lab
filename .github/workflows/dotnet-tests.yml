
name: .NET Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CorporateAutomation.slnx

      - name: Build solution
        run: dotnet build CorporateAutomation.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CorporateAutomation.slnx --configuration Release --no-build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f src/CorporateAutomation.Api/Dockerfile -t corporate-automation-api:ci .
