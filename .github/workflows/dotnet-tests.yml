
name: .NET Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Compilar .NET y ejecutar las pruebas automatizadas.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CorporateAutomation.slnx

      - name: Build solution
        run: dotnet build CorporateAutomation.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CorporateAutomation.slnx --configuration Release --no-build

  # 2. Comprobar que la imagen Docker se construye correctamente.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f src/CorporateAutomation.Api/Dockerfile -t corporate-automation-api:ci .

  # 3. Probar la API conectada a SQL Server real en Docker.
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CorporateAutomation.slnx

      - name: Generate temporary test credentials
        shell: bash
        run: |
          {
            printf 'MSSQL_SA_PASSWORD=Aa1!%s\n' "$(openssl rand -hex 24)"
            printf 'JWT_KEY=%s\n' "$(openssl rand -base64 32)"
            printf 'DEV_TOKEN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } > .env

      - name: Start SQL Server
        run: docker compose up -d --wait sqlserver

      - name: Apply database migrations
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12

          source .env

          export ConnectionStrings__CorporateAutomation="Server=127.0.0.1,14330;Database=CorporateAutomation;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"

          "$HOME/.dotnet/tools/dotnet-ef" database update \
            --project src/CorporateAutomation.Infrastructure \
            --startup-project src/CorporateAutomation.Api

      - name: Start API and wait for health
        run: docker compose up -d --build --wait api

      - name: Verify API and database integration
        shell: bash
        run: |
          set -euo pipefail

          # Verify API and database health.
          curl -fsS http://127.0.0.1:8080/health | grep -qx Healthy

          # A new database must have zero task statistics.
          curl -fsS http://127.0.0.1:8080/api/tareas/resumen |
            jq -e '
              .total == 0 and
              .pendientes == 0 and
              .completadas == 0 and
              .prioridadBaja == 0 and
              .prioridadMedia == 0 and
              .prioridadAlta == 0
            ' > /dev/null

          # Create a task in SQL Server.
          response=$(curl -fsS \
            -X POST http://127.0.0.1:8080/api/tareas \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Docker integration test","prioridad":"Alta"}')

          echo "$response" |
            jq -e '.id > 0 and .nombre == "Docker integration test"' > /dev/null

          # Verify that the task was persisted.
          curl -fsS http://127.0.0.1:8080/api/tareas |
            jq -e 'any(.[]; .nombre == "Docker integration test")' > /dev/null

          # Verify statistics against the real SQL Server database.
          curl -fsS http://127.0.0.1:8080/api/tareas/resumen |
            jq -e '
              .total == 1 and
              .pendientes == 1 and
              .completadas == 0 and
              .prioridadBaja == 0 and
              .prioridadMedia == 0 and
              .prioridadAlta == 1
            ' > /dev/null

      - name: Show container status on failure
        if: failure()
        run: docker compose ps

      - name: Clean up test containers
        if: always()
        shell: bash
        run: |
          if [ -f .env ]; then
            docker compose down -v
          fi
          rm -f .env

  # 4. Publicar la imagen Docker en GitHub Container Registry.
  publish-ghcr:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest

    # Publicar solo después de superar las tres comprobaciones.
    needs:
      - build-and-test
      - docker-build
      - docker-integration

    # Nunca publicar desde un Pull Request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image name and version
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CorporateAutomation.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
